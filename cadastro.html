<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Black Fitness</title>
    <link rel="stylesheet" href="Css/cadastro.css">
</head>
<body>
    
    <a href="index.html">Voltar</a>

    <h1><b>Cadastro Black Fitness</b></h1>

        <p>Faça seu cadastro, preencha os campos abaixo:</p>



    <form>
        <p><label for="nome">Nome:</label>
        <input id="nome" name="nome" type="text" placeholder="Nome"></p>

        <p><label for="cpf">CPF:</label>
        <input id="cpf" name="cpf" type="text" placeholder="CPF"></p>

        <p><label for="email">Email:</label>
        <input id="email" name="email" type="email" placeholder="Email"></p>

        <button type="submit">Enviar cadastro</button>
    </form>
</body>
</html>
