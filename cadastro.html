<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Black Fitness</title>
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>
    
    <a href="index.html" style="width: 300px; text-align: normal; display: block; color: rgb(205, 92, 205);">Voltar</a>

    <h1><b>Cadastro Black Fitness</b></h1>

        <p>Faça seu cadastro, preencha os campos abaixo:</p>



    <form>
        <p><label for="nome"><b>Nome:</b></label>
        <input id="nome" name="nome" type="text" placeholder="Nome" size="19"></p>

        <p><label for="cpf"><b>CPF:</b></label>
        <input id="cpf" name="cpf" type="password" placeholder="CPF" size="20"></p>

        <p><label for="email"><b>Email:</b></label>
        <input id="email" name="email" type="email" placeholder="Email" size="19"></p>

        <p><label for="idade"><b>Idade:</b></label>
        <input id="idade" name="idade" type="number" placeholder="Idade"></p>



        <button type="submit">Enviar cadastro</button>
    </form>
</body>
</html>
